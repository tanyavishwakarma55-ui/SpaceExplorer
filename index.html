<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Space Explorer</title>

    <style>

        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin-top: 20px;
            position: relative;
            z-index: 20;
        }


        /* STARS */

        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {

            from {
                opacity: 0.2;
            }

            to {
                opacity: 1;
            }

        }


        /* BUTTONS */

        .planet-buttons {
            position: relative;
            z-index: 30;
            margin: 10px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }


        /* INFORMATION PANEL */

        #info-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            width: 320px;
            padding: 15px;

            background: rgba(20, 20, 30, 0.95);

            border: 2px solid white;
            border-radius: 15px;

            z-index: 30;
        }

        #info-panel h2 {
            margin: 5px;
        }

        #info-panel p {
            margin: 10px;
        }


        /* SPACE */

        .space {
            position: relative;
            width: 100vw;
            height: 80vh;
        }


        /* SUN */

        .sun {
            position: absolute;

            width: 100px;
            height: 100px;

            background: orange;

            border-radius: 50%;

            top: 40%;
            left: 45%;

            box-shadow: 0 0 50px orange;

            z-index: 5;
        }


        /* ORBITS */

        .orbit {
            position: absolute;

            border: 1px solid rgba(255,255,255,0.2);

            border-radius: 50%;

            top: 45%;
            left: 50%;

            transform: translate(-50%, -50%);

            animation: orbit 10s linear infinite;

            z-index: 4;
        }

        .earth-orbit {
            width: 250px;
            height: 250px;
        }

        .mars-orbit {
            width: 380px;
            height: 380px;
            animation-duration: 16s;
        }

        .jupiter-orbit {
            width: 540px;
            height: 540px;
            animation-duration: 25s;
        }


        /* PLANETS */

        .planet {
            position: absolute;

            border-radius: 50%;

            top: -15px;
            left: 50%;

            transform: translateX(-50%);

            cursor: pointer;

            z-index: 10;
        }

        .earth {
            width: 35px;
            height: 35px;

            background: #3498db;

            box-shadow: 0 0 15px #3498db;
        }

        .mars {
            width: 28px;
            height: 28px;

            background: #e74c3c;

            box-shadow: 0 0 15px #e74c3c;
        }

        .jupiter {
            width: 65px;
            height: 65px;

            background: #c49a6c;

            box-shadow: 0 0 15px #c49a6c;
        }


        /* ORBIT ANIMATION */

        @keyframes orbit {

            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }

        }

    </style>

</head>


<body>

    <!-- STARS -->

    <div id="stars"></div>


    <h1>🌌 Space Explorer</h1>


    <!-- PLANET BUTTONS -->

    <div class="planet-buttons">

        <button id="earth-button">
            🌍 Earth
        </button>

        <button id="mars-button">
            🔴 Mars
        </button>

        <button id="jupiter-button">
            🪐 Jupiter
        </button>

    </div>


    <!-- INFORMATION -->

    <div id="info-panel">

        <h2 id="planet-name">
            Choose a Planet
        </h2>

        <p id="planet-info">
            Click a planet button to learn more.
        </p>

    </div>


    <!-- SPACE -->

    <div class="space">

        <div class="sun"></div>


        <div class="orbit earth-orbit">

            <div class="planet earth"></div>

        </div>


        <div class="orbit mars-orbit">

            <div class="planet mars"></div>

        </div>


        <div class="orbit jupiter-orbit">

            <div class="planet jupiter"></div>

        </div>

    </div>


    <script>

        /* CREATE STARS */

        const stars =
            document.getElementById("stars");

        for (let i = 0; i < 200; i++) {

            const star =
                document.createElement("div");

            star.className = "star";

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            star.style.animationDelay =
                Math.random() * 2 + "s";

            stars.appendChild(star);

        }


        /* INFORMATION PANEL */

        const planetName =
            document.getElementById("planet-name");

        const planetInfo =
            document.getElementById("planet-info");


        /* EARTH */

        document
            .getElementById("earth-button")
            .addEventListener("click", function() {

                planetName.textContent =
                    "🌍 Earth";

                planetInfo.textContent =
                    "Earth is the third planet from the Sun and the only known planet with life.";

            });


        /* MARS */

        document
            .getElementById("mars-button")
            .addEventListener("click", function() {

                planetName.textContent =
                    "🔴 Mars";

                planetInfo.textContent =
                    "Mars is the fourth planet from the Sun and is known as the Red Planet.";

            });


        /* JUPITER */

        document
            .getElementById("jupiter-button")
            .addEventListener("click", function() {

                planetName.textContent =
                    "🪐 Jupiter";

                planetInfo.textContent =
                    "Jupiter is the largest planet in our Solar System.";

            });


        /* CLICKING PLANETS */

        document
            .querySelector(".earth")
            .addEventListener("click", function() {

                document
                    .getElementById("earth-button")
                    .click();

            });


        document
            .querySelector(".mars")
            .addEventListener("click", function() {

                document
                    .getElementById("mars-button")
                    .click();

            });


        document
            .querySelector(".jupiter")
            .addEventListener("click", function() {

                document
                    .getElementById("jupiter-button")
                    .click();

            });

    </script>

</body>

</html>
