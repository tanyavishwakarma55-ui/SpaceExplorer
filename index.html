
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071126">
<title>Space Explorer | Solar System</title>

<style>
:root {
    --space: #071126;
    --orbit: rgba(133, 169, 230, 0.22);
    --text: #f4f7ff;
    --muted: #b8c8e8;
    --blue: #69a7ff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(
        ellipse at 50% 45%,
        #172b52 0%,
        #0b1731 48%,
        #030814 100%
    );
}

.stars,
.stars::before,
.stars::after {
    position: fixed;
    inset: 0;
    content: "";
    pointer-events: none;
}

.stars {
    z-index: 0;
    background-image:
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 90px 120px, #fff, transparent),
        radial-gradient(1px 1px at 160px 70px, #9cc8ff, transparent),
        radial-gradient(2px 2px at 230px 180px, #fff, transparent),
        radial-gradient(1px 1px at 310px 40px, #fff, transparent);
    background-size: 340px 240px;
    animation: twinkle 5s ease-in-out infinite alternate;
}

.stars::before {
    background-image:
        radial-gradient(1px 1px at 70px 80px, #fff, transparent),
        radial-gradient(2px 2px at 190px 150px, #b8d8ff, transparent),
        radial-gradient(1px 1px at 280px 210px, #fff, transparent);
    background-size: 390px 290px;
}

@keyframes twinkle {
    from { opacity: .45; }
    to { opacity: 1; }
}

.page {
    position: relative;
    z-index: 1;
    width: min(1200px, 100%);
    margin: 0 auto;
    padding: 24px 20px 50px;
}

header {
    text-align: center;
    margin-bottom: 8px;
}

header h1 {
    margin: 0;
    font-size: clamp(30px, 5vw, 48px);
    letter-spacing: -1px;
}

header p {
    color: var(--muted);
    margin: 10px 0;
    font-size: 15px;
}

.solar-system {
    position: relative;
    width: min(94vw, 850px);
    aspect-ratio: 1;
    margin: 0 auto;
    max-height: 850px;
}

/* Sun */
.sun {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(42px, 6vw, 72px);
    height: clamp(42px, 6vw, 72px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 2;
    background: radial-gradient(
        circle at 35% 30%,
        #fff7b5 0%,
        #ffd75a 28%,
        #ff9e20 65%,
        #f66b12 100%
    );
    box-shadow:
        0 0 22px #ffb32f,
        0 0 55px rgba(255, 153, 26, .55),
        0 0 100px rgba(255, 133, 21, .2);
}

/* Planet orbits */
.orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    border: 1px solid var(--orbit);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.orbit-path {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    animation: orbit-spin var(--duration) linear infinite;
}

@keyframes orbit-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* Planets */
.planet {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translate(-50%, -50%);
    border: 0;
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
    pointer-events: auto;
    background-color: transparent;
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    transition: filter .2s ease, scale .2s ease;
}

.planet:hover,
.planet:focus-visible {
    filter: brightness(1.25);
    scale: 1.12;
    outline: 2px solid rgba(255,255,255,.7);
    outline-offset: 4px;
}

.mercury {
    width: 13px;
    height: 13px;
    background-image: url("https://www.solarsystemscope.com/textures/download/2k_mercury.jpg");
    box-shadow: 0 0 8px #b9b4aa;
}

.venus {
    width: 19px;
    height: 19px;
    background-image: url("https://www.solarsystemscope.com/textures/download/2k_venus_surface.jpg");
    box-shadow: 0 0 10px #d9a35b;
}

.earth {
    width: 23px;
    height: 23px;
    background-image: url("https://www.solarsystemscope.com/textures/download/2k_earth_daymap.jpg");
    box-shadow: 0 0 12px #5caaff;
}

.mars {
    width: 19px;
    height: 19px;
    background-image: url("https://www.solarsystemscope.com/textures/download/2k_mars.jpg");
    box-shadow: 0 0 10px #e77749;
}

.jupiter {
    width: 39px;
    height: 39px;
    background-image: url("https://www.solarsystemscope.com/textures/download/2k_jupiter.jpg");
    box-shadow: 0 0 12px #d4ad85;
}

/* Saturn and its rings */
.saturn-system {
    position: absolute;
    left: 50%;
    top: 0;
    width: 70px;
    height: 70px;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.saturn-body {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 32px;
    height: 32px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 2;
    pointer-events: auto;
    cursor: pointer;
    border: none;
    padding: 0;
    background-color: #c9b18a;
    background-image: url("https://www.solarsystemscope.com/textures/download/2k_saturn.jpg");
    background-size: cover;
    background-position: center;
    box-shadow: inset -6px -3px 8px #261b1299, 0 0 9px #d7bd8b55;
}

.saturn-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 68px;
    height: 27px;
    border-radius: 50%;
    transform: translate(-50%, -50%) rotate(-20deg);
    background: repeating-linear-gradient(
        180deg,
        #8c704d 0%,
        #f0dfbb 13%,
        #b79a6c 25%,
        #e4d0a5 39%,
        #927650 52%,
        #e9d9b6 66%,
        #a78b60 80%,
        #e6d4ad 100%
    );
    -webkit-mask: radial-gradient(
        ellipse,
        transparent 0 34%,
        #000 39% 62%,
        transparent 67%
    );
    mask: radial-gradient(
        ellipse,
        transparent 0 34%,
        #000 39% 62%,
        transparent 67%
    );
    pointer-events: none;
}

.saturn-ring-back {
    z-index: 1;
    clip-path: inset(0 0 48% 0);
}

.saturn-ring-front {
    z-index: 3;
    clip-path: inset(48% 0 0 0);
}

.uranus {
    width: 27px;
    height: 27px;
    background-image: url("https://www.solarsystemscope.com/textures/download/2k_uranus.jpg");
    box-shadow: 0 0 10px #8be4e755;
}

.neptune {
    width: 25px;
    height: 25px;
    background-image: url("https://www.solarsystemscope.com/textures/download/2k_neptune.jpg");
    box-shadow: 0 0 10px #488dff88;
}

/* ASTEROID BELT: between Mars and Jupiter */
.asteroid-belt {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 51%;
    height: 51%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 1;
    pointer-events: none;
}

.asteroid-field {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    animation: orbit-spin 32s linear infinite;
}

.asteroid {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--size, 4px);
    height: var(--size, 4px);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: var(--rock, #b7a184);
    box-shadow: 0 0 4px var(--rock, #b7a184);
    opacity: .9;
}


@keyframes asteroid-twinkle {
    from { opacity: .45; }
    to { opacity: 1; }
}

.asteroid-label {
    position: absolute;
    left: 50%;
    top: -2%;
    transform: translate(-50%, -100%);
    padding: 5px 9px;
    border-radius: 999px;
    color: #e5d2b5;
    background: #071126;
    border: 1px solid rgba(190, 166, 132, .5);
    font-size: 10px;
    letter-spacing: 1px;
    white-space: nowrap;
    z-index: 3;
}

/* Orbit sizes */
.orbit-1 { width: 15%; height: 15%; }
.orbit-2 { width: 25%; height: 25%; }
.orbit-3 { width: 35%; height: 35%; }
.orbit-4 { width: 45%; height: 45%; }
.orbit-5 { width: 57%; height: 57%; }
.orbit-6 { width: 69%; height: 69%; }
.orbit-7 { width: 81%; height: 81%; }
.orbit-8 { width: 94%; height: 94%; }

/* Information panel */
.info-panel {
    width: min(600px, 100%);
    margin: 18px auto 0;
    padding: 22px;
    border: 1px solid rgba(150, 187, 255, .2);
    border-radius: 18px;
    background: rgba(10, 23, 48, .8);
    box-shadow: 0 15px 45px #0003;
    backdrop-filter: blur(12px);
    text-align: left;
}

.info-panel h2 {
    margin: 0 0 10px;
    font-size: 25px;
    color: #fff;
}

.info-panel p {
    margin: 0;
    line-height: 1.65;
    color: #b8c8e8;
}

.planet-facts {
    list-style: none;
    padding: 0;
    margin: 16px 0 0;
    display: grid;
    gap: 10px;
}

.planet-facts li {
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(88, 128, 195, .12);
    border: 1px solid rgba(157, 190, 255, .14);
    color: #dce8ff;
    line-height: 1.6;
    font-size: 14px;
}

.planet-facts li strong {
    color: #8fc1ff;
}

/* Navigation buttons */
.planet-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 18px auto 0;
}

.planet-buttons button {
    color: #eaf2ff;
    background: rgba(53, 83, 135, .4);
    border: 1px solid rgba(157, 190, 255, .22);
    border-radius: 999px;
    padding: 9px 13px;
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease;
}

.planet-buttons button:hover,
.planet-buttons button:focus-visible {
    background: rgba(76, 132, 222, .5);
    outline: 1px solid var(--blue);
}

.hint {
    text-align: center;
    color: #91a7cc;
    font-size: 13px;
    margin-top: 14px;
}

/* Mobile responsive */
@media (max-width: 600px) {
    .page {
        padding: 20px 12px 35px;
    }

    .solar-system {
        width: 96vw;
    }

    .info-panel {
        padding: 18px;
    }

    .planet-buttons {
        gap: 6px;
    }

    .planet-buttons button {
        padding: 8px 10px;
        font-size: 12px;
    }
}

/* Respect reduced-motion preferences */
@media (prefers-reduced-motion: reduce) {
    .stars,
    .orbit-path,
    .asteroid-field,
    .asteroid {
        animation: none;
    }
}
</style>
</head>

<body>
<div class="stars" aria-hidden="true"></div>

<main class="page">
    <header>
        <h1>🌌 Space Explorer</h1>
        <p>Explore all eight planets and the Asteroid Belt</p>

    <section class="solar-system" aria-label="Interactive solar system">

<div class="asteroid-field" id="asteroidField"></div>

    <nav class="planet-buttons" aria-label="Choose a planet or region">

        <button data-select="venus">Venus</button>
        <button data-select="earth">Earth</button>
        <button data-select="mars">Mars</button>

</main>

        "#a99a88",
        "#827d79",
        "#c1ad91",
        "#eee0c8"
    ];

    asteroid.style.setProperty("--x", `${x}%`);
    asteroid.style.setProperty("--y", `${y}%`);
    asteroid.style.setProperty("--size", `${size}px`);
    asteroid.style.setProperty(
        "--rock",
        rockColors[Math.floor(Math.random() * rockColors.length)]
    );

    asteroidField.appendChild(asteroid);
}


function showPlanet(key) {
    const planet = planetDetails[key];

    if (!planet) return;

    document.getElementById("planetName").textContent = planet.name;
    document.getElementById("planetIntro").textContent = planet.intro;

    const factsList = document.getElementById("planetFacts");
    factsList.replaceChildren();

    planet.facts.forEach(([label, description]) => {
        const item = document.createElement("li");
        const title = document.createElement("strong");

        title.textContent = label + ": ";
        item.appendChild(title);
        item.appendChild(document.createTextNode(description));
        factsList.appendChild(item);
    });
}

document.querySelectorAll("[data-planet]").forEach(button => {
    button.addEventListener("click", () => {
        showPlanet(button.dataset.planet);
    });
});

document.querySelectorAll("[data-select]").forEach(button => {
    button.addEventListener("click", () => {
        showPlanet(button.dataset.select);
    });
});
</script>
</body>
